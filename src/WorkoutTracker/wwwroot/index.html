<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RepLog</title>
    <meta name="description" content="RepLog — a fast, offline-first workout tracker." />
    <meta name="theme-color" content="#0a0b0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <base href="/" />
    <script>
        // Apply saved theme before first paint to avoid a flash.
        try {
            const t = localStorage.getItem('workout-tracker:theme');
            if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        } catch { }
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-logo">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#12160a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z" /></svg>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker?.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
