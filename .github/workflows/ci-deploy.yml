name: Build, test & deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore --verbosity normal

      # GitHub Pages serves project sites from /<repo>/. Set the base path BEFORE publishing
      # so the service worker's integrity hashes match the final index.html.
      - name: Set base path
        run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' src/WorkoutTracker/wwwroot/index.html

      - name: Publish
        run: dotnet publish src/WorkoutTracker -c Release -o publish --no-restore

      - name: Prepare static site
        run: |
          cd publish/wwwroot
          cp index.html 404.html   # SPA fallback so deep links like /history work
          touch .nojekyll          # serve the _framework folder as-is

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
